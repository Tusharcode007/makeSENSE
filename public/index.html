<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakeSense AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1a1f33, #080c14);
      color: #eaeaea;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #bbd2ff, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #bbd2ff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .auth-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .chat-window {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-window::-webkit-scrollbar {
      width: 6px;
    }
    .chat-window::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .message {
      max-width: 85%;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .message.assistant .bubble {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 4px;
    }

    .action-badge {
      align-self: flex-start;
      margin-top: 8px;
      margin-left: 8px;
      padding: 4px 12px;
      font-size: 0.75rem;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: capitalize;
    }

    .action-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 6px #34d399;
    }

    .chat-input-area {
      padding: 20px 24px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .chat-input-area input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
    }

    .chat-input-area button {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-input-area button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .chat-input-area button:active {
      transform: translateY(0);
    }

    .typing-indicator {
      display: none;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      align-self: flex-start;
      margin-bottom: 8px;
    }
    
    .typing-indicator span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      margin: 0 2px;
      animation: pulse 1s infinite alternate;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      to { transform: translateY(-4px); background: #fff; }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>MakeSense AI</h1>
      <a href="/auth/google" class="auth-btn" target="_blank">Authorize APIs</a>
    </div>
    
    <div class="chat-window" id="chatWindow">
      <div class="message assistant">
        <div class="bubble">Hello! I'm your MakeSense AI Assistant. I can interact with your Calendar, draft Gmails, manage Drive logs, and respond intelligently to queries layered with Decision Logic! How can I help you?</div>
      </div>
    </div>

    <div class="chat-window" id="typingContainer" style="padding-top: 0; padding-bottom: 0px; flex: 0; min-height: 0;">
      <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="E.g. Schedule a meeting tomorrow at 5..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    
    // Assign a persistent random user ID for the session context
    const userId = 'local_dev_user_' + Math.random().toString(36).substr(2, 6);

    function appendMessage(role, text, intent = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msgDiv.appendChild(bubble);

      // If the intent is an action rather than chat, display an elegant badge indicating the action taken!
      if (role === 'assistant' && intent && intent !== 'general_chat') {
        const badge = document.createElement('div');
        badge.className = 'action-badge';
        badge.innerHTML = `Running Action: ${intent.split('_').join(' ')}`;
        msgDiv.appendChild(badge);
      }

      chatWindow.appendChild(msgDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      
      typingIndicator.style.display = 'block';
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const response = await fetch('/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, message: text })
        });

        const data = await response.json();
        
        typingIndicator.style.display = 'none';
        
        if (response.ok) {
           appendMessage('assistant', data.response, data.intent);
        } else {
           appendMessage('assistant', 'Error: ' + data.error);
        }
      } catch (error) {
        typingIndicator.style.display = 'none';
        appendMessage('assistant', 'Network connection unavailable.');
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
